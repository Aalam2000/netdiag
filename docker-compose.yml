services:
  netdiag:
    build: .
    container_name: netdiag
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    environment:
      - TZ=Asia/Baku
    volumes:
      - ./netdiag.py:/app/netdiag.py:ro
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    command: python /app/netdiag.py
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 256M