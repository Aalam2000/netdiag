services:
  netdiag:
    build: .
    container_name: netdiag
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    environment:
      - TZ=Asia/Baku
    volumes:
      - ./netdiag.py:/app/netdiag.py:ro
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
      - /var/log:/host_log:ro        # журналы сервера для строки о безопасности
    command: python /app/netdiag.py
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 256M

  # Отчёт: раз в неделю (вт 10:00) строит и отдаёт по HTTP на порту 8090
  # (для кнопки на сайте). Отдельный контейнер — построение отчёта не
  # отнимает процессор у сборщика и не искажает замеры.
  netdiag-report:
    build: .
    container_name: netdiag-report
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    environment:
      - TZ=Asia/Baku
      - NETDIAG_HTTP_PORT=8090
    env_file:                        # GEMINI_API_KEY; файла может не быть
      - path: .env
        required: false
    volumes:
      - ./netdiag.py:/app/netdiag.py:ro
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
      - /var/log:/host_log:ro
    command: python /app/netdiag.py serve
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  # Печать отчёта: запускается только командой netdiag print (cron по
  # вторникам), печатает и удаляется. Постоянно не работает.
  netdiag-print:
    build:
      context: .
      dockerfile: Dockerfile.print
    image: netdiag-print
    profiles: ["print"]
    network_mode: host
    environment:
      - TZ=Asia/Baku
      - NETDIAG_HTTP_PORT=8090
      - PRINTER_URI=ipp://192.168.0.30/ipp/print    # Epson L3250, адрес закреплён
    volumes:
      - ./script/print.sh:/print.sh:ro
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    entrypoint: ["sh", "/print.sh"]
    command: ["az"]
